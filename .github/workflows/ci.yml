name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    services:
      db:
        image: pgvector/pgvector:pg17
        env:
          POSTGRES_USER: codeatlas
          POSTGRES_PASSWORD: codeatlas
          POSTGRES_DB: codeatlas
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U codeatlas -d codeatlas"
          --health-interval 2s
          --health-timeout 3s
          --health-retries 30
    env:
      TEST_DATABASE_URL: postgresql+psycopg://codeatlas:codeatlas@localhost:5432/codeatlas_test
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - run: uv sync
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run mypy src
      - name: Install the PostgreSQL 17 client
        # pg_dump and pg_restore at the server's major version, so the backup and restore tests run
        # instead of skipping. Version 17's directory goes first on the PATH, ahead of Ubuntu's
        # wrappers, which may pick another installed version (specs/004-pilot-deployment research
        # R18).
        run: |
          . /etc/os-release
          sudo install -d /etc/apt/keyrings
          sudo curl -fsSL -o /etc/apt/keyrings/postgresql.asc https://www.postgresql.org/media/keys/ACCC4CF8.asc
          echo "deb [signed-by=/etc/apt/keyrings/postgresql.asc] https://apt.postgresql.org/pub/repos/apt $VERSION_CODENAME-pgdg main" |
            sudo tee /etc/apt/sources.list.d/pgdg.list > /dev/null
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends postgresql-client-17
          echo /usr/lib/postgresql/17/bin >> "$GITHUB_PATH"
      - run: uv run pytest
      - name: Check the build arguments
        # Railway gives a build only the variables its Dockerfile declares as arguments, so only
        # these non-secret ones are allowed (specs/004-pilot-deployment research R5).
        run: |
          declared="$(awk '
            /^[ \t]*#/ { next }
            { line = line $0 }
            /\\[ \t]*$/ { sub(/\\[ \t]*$/, " ", line); next }
            { n = split(line, word); line = "" }
            n > 0 && toupper(word[1]) == "ARG" { for (i = 2; i <= n; i++) { sub(/=.*/, "", word[i]); print word[i] } }
          ' Dockerfile)"
          status=0
          for name in $declared; do
            case "$name" in
              CODEATLAS_RELEASE | API_ORIGIN | RAILWAY_GIT_COMMIT_SHA | NEXT_PUBLIC_RELEASE) ;;
              *)
                echo "::error file=backend/Dockerfile::Build argument $name is not allowed"
                status=1
                ;;
            esac
          done
          exit "$status"
      - name: Build the release image
        run: docker build .

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: node --test "scripts/*.test.mjs"
      - run: npm run build
      - name: Check the build arguments
        # Railway gives a build only the variables its Dockerfile declares as arguments, so only
        # these non-secret ones are allowed (specs/004-pilot-deployment research R5).
        run: |
          declared="$(awk '
            /^[ \t]*#/ { next }
            { line = line $0 }
            /\\[ \t]*$/ { sub(/\\[ \t]*$/, " ", line); next }
            { n = split(line, word); line = "" }
            n > 0 && toupper(word[1]) == "ARG" { for (i = 2; i <= n; i++) { sub(/=.*/, "", word[i]); print word[i] } }
          ' Dockerfile)"
          status=0
          for name in $declared; do
            case "$name" in
              CODEATLAS_RELEASE | API_ORIGIN | RAILWAY_GIT_COMMIT_SHA | NEXT_PUBLIC_RELEASE) ;;
              *)
                echo "::error file=frontend/Dockerfile::Build argument $name is not allowed"
                status=1
                ;;
            esac
          done
          exit "$status"
      - name: Build the release image
        run: docker build --target production .

  schema:
    # Reports the pull request's migrations with the rule they must follow; it never fails
    # (specs/004-pilot-deployment research R7).
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Report schema changes
        env:
          BASE_REF: ${{ github.base_ref }}
        run: |
          changes="$(git diff --name-status "origin/$BASE_REF...HEAD" -- backend/alembic/versions/)"
          if [ -z "$changes" ]; then
            echo "No schema change" >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          {
            echo "## Schema change"
            echo
            echo "Migrations this pull request changes (A added, M modified, D deleted, R renamed, C copied):"
            echo
            echo '```'
            echo "$changes"
            echo '```'
            echo
            echo "Expand, then contract: add in one release and remove in a later one, so the running"
            echo "version keeps working with the new schema during the release and after a rollback."
          } >> "$GITHUB_STEP_SUMMARY"
          echo "::warning title=Schema change::This pull request changes migrations; expand, then contract (see the job summary)"

  e2e:
    needs: [backend, frontend]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Configure fake mode
        # Fixture repositories and fake model providers: no GitHub App or API keys needed.
        run: |
          WEBHOOK_SECRET="$(openssl rand -hex 32)"
          echo "::add-mask::$WEBHOOK_SECRET"
          {
            echo "CODEATLAS_ENV=development"
            echo "CODEATLAS_FAKE_EXTERNALS=1"
            echo "TOKEN_ENCRYPTION_KEY=$(python3 -c 'import base64, os; print(base64.urlsafe_b64encode(os.urandom(32)).decode())')"
            echo "GITHUB_WEBHOOK_SECRET=$WEBHOOK_SECRET"
            echo "RATE_LIMIT_PER_MINUTE=0"
            echo "PILOT_DAILY_QUESTION_LIMIT=1000"
            echo "PILOT_DAILY_REVIEW_LIMIT=1000"
          } > .env
          # Playwright signs its webhook deliveries with the same per-run secret.
          echo "GITHUB_WEBHOOK_SECRET=$WEBHOOK_SECRET" >> "$GITHUB_ENV"
      - name: Start the stack
        # The api and worker services start after the migrate service has run the migrations.
        run: docker compose up -d --build
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
        working-directory: frontend
      - run: npx playwright install --with-deps chromium
        working-directory: frontend
      - name: Wait for the API and the web app
        run: |
          timeout 300 bash -c 'until curl -sf http://localhost:8000/healthz > /dev/null; do sleep 2; done'
          timeout 300 bash -c 'until curl -sf http://localhost:3000 > /dev/null; do sleep 2; done'
      - run: npm run test:e2e
        working-directory: frontend
      - name: Upload the Playwright report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: frontend/playwright-report/
          retention-days: 14
      - name: Show service logs
        if: failure()
        run: docker compose logs --no-color
      - name: Stop the stack
        if: always()
        run: docker compose down --volumes
